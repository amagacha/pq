<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        都道府県クイズ
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <header>

        <h1>
            🗾 都道府県クイズ
        </h1>

        <p>
            光っている都道府県の名前を答えよう！
        </p>

    </header>


    <main class="game">


        <div class="topbar">


            <span
                id="questionNumber"
            >
                第1問
            </span>


            <span>

                スコア：

                <span
                    id="score"
                >
                    0
                </span>

            </span>


            <div
                class="progress-buttons"
            >


                <button
                    id="saveProgressButton"
                    type="button"
                >

                    💾 進捗を保存

                </button>


                <button
                    id="deleteProgressButton"
                    type="button"
                >

                    🗑️ 進捗を削除

                </button>


            </div>


        </div>


        <div
            class="map-container"
        >

            <div
                id="map"
            >

                地図を読み込み中...

            </div>

        </div>


        <div
            class="question-area"
        >


            <div
                class="question"
            >

                光っている都道府県はどこ？

            </div>


            <div
                class="answer-area"
            >


                <div
                    class="combo-box"
                >


                    <input
                        type="text"
                        id="answer"
                        placeholder="都道府県名を入力または選択"
                        autocomplete="off"
                    >


                    <button
                        id="comboButton"
                        type="button"
                    >

                        ▼

                    </button>


                    <div
                        id="dropdown"
                        class="dropdown"
                    >

                    </div>


                </div>


                <button
                    id="answerButton"
                    type="button"
                >

                    回答する

                </button>


            </div>


            <div
                id="result"
                class="result"
            >

            </div>


            <button
                id="nextButton"
                class="next-button"
                type="button"
            >

                次の問題

            </button>


        </div>


    </main>


</div>


<script
    src="script.js"
>

</script>


</body>

</html>
